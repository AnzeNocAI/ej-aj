name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Content checks
        run: node scripts/preveri.mjs
      - name: No em or en dashes in page templates
        run: |
          if grep -rn "[—–]" src/pages src/components src/layouts; then
            echo "Dash found. Use a comma, colon, parentheses or a new sentence."
            exit 1
          fi
      - run: npm run build
