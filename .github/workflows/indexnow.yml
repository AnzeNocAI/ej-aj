name: IndexNow

# After a push to main (= publishing), tell Bing and the other IndexNow search engines which
# pages changed. Google does not use IndexNow; it reads the sitemap.
on:
  push:
    branches: [main]
  # Manual run from the Actions tab: submits every page in the sitemap.
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.event_name == 'push'
        run: node scripts/indexnow.mjs ${{ github.event.before }} ${{ github.sha }}
      - if: github.event_name == 'workflow_dispatch'
        run: node scripts/indexnow.mjs --all
